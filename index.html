<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiszkownik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{
  --bg:#F1F4F8;--surface:#FFFFFF;--surface-2:#E8EDF4;--fg:#14213D;--fg-2:#4B5A77;--line:#D3DAE6;
  --hl:#FFD43B;--hl-strong:#E9B800;--hl-ink:#2E2500;--hl-soft:#FFF2B3;--hl-soft-fg:#5A4600;
  --de-bg:#E1E8FB;--de-fg:#22388A;
  --good:#17784F;--good-bg:#DCF2E6;--bad:#B93426;--bad-bg:#FBE0DC;
  --rule:#D6E4F7;--margin:#E8998F;
  --f0:#DCE6FA;--f1:#FBE7C6;--f2:#D6EFE0;--f3:#F8D8D3;--f4:#E4DBF6;--f5:#E0E5EA;
  --shadow:0 1px 0 rgba(20,33,61,.06),0 8px 20px -10px rgba(20,33,61,.28);
  --font-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1322;--surface:#172036;--surface-2:#202C48;--fg:#EDF0F7;--fg-2:#A5B1CB;--line:#2C3A5C;
  --hl:#FFD43B;--hl-strong:#FFE066;--hl-ink:#2E2500;--hl-soft:#4B4010;--hl-soft-fg:#FFE58A;
  --de-bg:#26335F;--de-fg:#B3C3FF;--good:#4CC38A;--good-bg:#17382B;--bad:#FF8A7A;--bad-bg:#42201C;
  --rule:#243250;--margin:#7F3F3C;
  --f0:#22315A;--f1:#4A3C20;--f2:#1D4034;--f3:#4B2B2A;--f4:#3A305C;--f5:#2C3547;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322;--surface:#172036;--surface-2:#202C48;--fg:#EDF0F7;--fg-2:#A5B1CB;--line:#2C3A5C;
  --hl:#FFD43B;--hl-strong:#FFE066;--hl-ink:#2E2500;--hl-soft:#4B4010;--hl-soft-fg:#FFE58A;
  --de-bg:#26335F;--de-fg:#B3C3FF;--good:#4CC38A;--good-bg:#17382B;--bad:#FF8A7A;--bad-bg:#42201C;
  --rule:#243250;--margin:#7F3F3C;
  --f0:#22315A;--f1:#4A3C20;--f2:#1D4034;--f3:#4B2B2A;--f4:#3A305C;--f5:#2C3547;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:780px;margin:0 auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.bar-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.brand{border:0;background:none;padding:4px 0;cursor:pointer;color:var(--fg);font:700 22px/1 var(--font-display)}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);padding:0 2px}
.status{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);border-radius:99px;min-height:32px;padding:0 12px;font:500 12.5px var(--font-body);cursor:default}
.status i{width:8px;height:8px;border-radius:50%;background:var(--fg-2);flex:none}
.status[data-s=synced] i{background:var(--good)}.status[data-s=saving] i{background:var(--hl-strong)}
.status[data-s=error]{cursor:pointer;color:var(--bad)}.status[data-s=error] i{background:var(--bad)}
.acct-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;min-height:32px;padding:0 12px;font:600 12.5px var(--font-body);cursor:pointer;max-width:250px}
.acct-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-btn:hover{background:var(--surface-2)}
.acct-btn.primary-pill{background:var(--hl);border-color:var(--hl-strong);color:var(--hl-ink)}
.acct-btn.primary-pill:hover{background:var(--hl-strong)}
.acct-btn.logged{background:var(--hl-soft);border-color:var(--hl-strong);color:var(--hl-soft-fg)}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;cursor:pointer;flex:none}
.theme-btn:hover{background:var(--surface-2)}
h1,h2{margin:0;font-family:var(--font-display);text-wrap:balance}
.h1{font-size:clamp(26px,6vw,34px);line-height:1.1;font-weight:700;margin:22px 0 8px}
.sect{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-2);font-weight:600;font-family:var(--font-body);margin:28px 0 8px}
.muted{color:var(--fg-2);margin:0 0 14px;max-width:62ch}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:14px;font-size:13px;color:var(--fg-2)}
.crumbs button{border:0;background:none;color:var(--fg-2);padding:6px 4px;cursor:pointer;font:500 13px var(--font-body);text-decoration:underline;text-underline-offset:3px}
.btn{font:600 14px var(--font-body);min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--hl);border-color:var(--hl-strong);color:var(--hl-ink)}.btn.primary:hover{background:var(--hl-strong)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}.btn.big{min-height:52px;font-size:15px;padding:0 22px}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}.btn.danger{color:var(--bad);border-color:rgba(185,52,38,.3)}
.btn.danger:hover{background:var(--bad-bg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ic{flex:none}.actions,.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 14px;padding-top:10px}
.folder-card{position:relative;border-radius:4px 12px 12px 12px;background:var(--fc);border:1px solid var(--line);color:var(--fg);display:flex;flex-direction:column;min-height:102px}
.folder-card::before{content:"";position:absolute;left:-1px;top:-12px;width:78px;height:12px;background:var(--fc);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0}
.folder-open{flex:1;border:0;background:none;text-align:left;padding:18px 42px 14px 16px;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:4px;border-radius:4px 12px 12px 12px}
.folder-open:hover{background:rgba(0,0,0,.03)}
.folder-del{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:rgba(255,255,255,.45);color:var(--bad);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.folder-del:hover{background:var(--bad-bg);border-color:rgba(185,52,38,.3)}
.f-name{font:700 18px/1.2 var(--font-display);overflow-wrap:anywhere}.f-meta{font-size:13px;color:var(--fg-2)}
.setrow{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.setmain,.cardrow{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--fg);font:inherit;display:block}
.setmain:hover,.cardrow:hover{background:var(--surface-2)}
.setmain b{font:700 17px var(--font-display);display:block;overflow-wrap:anywhere}
.small{font-size:13px;color:var(--fg-2)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;background:var(--good)}
.cardrow{margin-bottom:8px;width:100%}.cardrow .pair{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.cardrow .de{font-weight:600}.cardrow .nt{grid-column:1/-1;font-size:13px;color:var(--fg-2)}
@media(max-width:520px){.cardrow .pair{grid-template-columns:1fr}}
.pips{display:inline-flex;gap:3px;margin-top:6px}.pip{width:6px;height:6px;border-radius:50%;background:var(--line)}.pip.on{background:var(--good)}
.tag{display:inline-flex;align-items:center;font:700 11px/1 var(--font-body);letter-spacing:.06em;border-radius:5px;padding:4px 6px}
.tag.de{background:var(--de-bg);color:var(--de-fg)}.tag.pl{background:var(--hl-soft);color:var(--hl-soft-fg)}
.notice{padding:10px 12px;border-radius:10px;margin:10px 0;background:var(--surface-2);font-size:14px}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.resume-box{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;margin:14px 0;background:var(--hl-soft);border:1px solid var(--hl-strong);color:var(--hl-soft-fg)}
.resume-box b{display:block;font-size:14px;color:var(--fg)}
.resume-box .actions{margin:0}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--fg-2)}
.empty p{margin:0 0 12px}
input[type=text],input[type=email],input[type=password],select{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 10px;font:500 16px var(--font-body);min-width:0;width:100%}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;margin-bottom:12px}
.field label,.lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);font-weight:600}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1 1 auto;border:0;background:none;min-height:42px;padding:0 14px;font:500 14px var(--font-body);color:var(--fg-2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--hl);color:var(--hl-ink);font-weight:600}
.stage{display:block;overflow:auto;max-height:62vh;background:var(--surface-2);border-radius:12px;padding:8px;text-align:center;-webkit-overflow-scrolling:touch;border:1px solid var(--line)}
.shot{position:relative;display:inline-block;line-height:0;vertical-align:top;-webkit-touch-callout:none;user-select:none;transform-origin:top left}
.shot img{display:block;border-radius:6px;user-select:none;-webkit-user-drag:none;width:100%;height:auto}
.ov{position:absolute;inset:0;touch-action:none;cursor:crosshair;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
.ov canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:6px}
.ov.pan-mode{cursor:grab;touch-action:auto}
.zoom-bar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.zoom-grp{display:flex;align-items:center;gap:4px}
.zoom-val{font:600 12.5px var(--font-body);min-width:44px;text-align:center;color:var(--fg)}
.btn.xs{min-height:30px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn.xs.active{background:var(--hl);border-color:var(--hl-strong);color:var(--hl-ink)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.sel{position:absolute;background:rgba(255,212,59,.38);border:2px solid var(--hl-strong);border-radius:3px;pointer-events:none}
.sel b{position:absolute;top:-2px;left:-2px;background:var(--hl);color:var(--hl-ink);font:700 11px/1 var(--font-body);padding:3px 5px;border-radius:3px 0 3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--hl-soft);color:var(--hl-soft-fg);border:0;border-radius:99px;min-height:34px;padding:0 12px;font:600 13px var(--font-body);cursor:pointer}
.dock{position:sticky;bottom:0;padding:14px 0 max(12px,env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.row{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
.row.off{opacity:.55}.row input[type=checkbox]{width:22px;height:22px;margin-top:20px;accent-color:var(--fg)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;min-width:0}.fields .wide{grid-column:1/-1}
@media(max-width:520px){.fields{grid-template-columns:1fr}}
.row .field{margin-bottom:8px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--hl-strong);animation:sp .9s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.fc-wrap{perspective:1200px;margin:16px 0;position:relative;overflow:visible}
.fc{position:relative;display:block;width:100%;min-height:300px;border:0;padding:0;background:none;cursor:grab;font:inherit;color:inherit;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.fc.dragging{cursor:grabbing}
.fc-swipe{position:relative;min-height:300px;will-change:transform;transition:transform .28s cubic-bezier(.22,.8,.36,1),opacity .22s ease}
.fc.dragging .fc-swipe{transition:none}
.fc-in{position:relative;min-height:300px;transition:transform .45s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);background-color:var(--surface);display:flex;flex-direction:column;overflow:hidden;
  background-image:linear-gradient(to bottom,transparent 47px,var(--margin) 47px,var(--margin) 49px,transparent 49px),repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px)}
.swipe-stamp{position:absolute;top:16px;z-index:3;padding:6px 12px;border-radius:99px;font:700 12.5px/1 var(--font-body);letter-spacing:.04em;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .12s ease,transform .12s ease;border:1.5px solid currentColor}
.swipe-stamp.right{right:16px;background:var(--good-bg);color:var(--good);transform:rotate(6deg)}
.swipe-stamp.left{left:16px;background:var(--bad-bg);color:var(--bad);transform:rotate(-6deg)}
.swipe-hint-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--fg-2)}
.swipe-hint-bar .sh-l{color:var(--bad);font-weight:600}
.swipe-hint-bar .sh-r{color:var(--good);font-weight:600}
.face.back{transform:rotateY(180deg)}.face.static{position:relative;min-height:230px}
.face .head{height:48px;display:flex;align-items:center;padding:0 16px;gap:8px}
.face .bd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 24px 24px;gap:10px}
.term{font:700 clamp(28px,7vw,44px)/1.15 var(--font-display);overflow-wrap:anywhere;text-wrap:balance}
.nt2{font-size:14px;color:var(--fg-2)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers .btn{min-height:54px;font-size:15px}.know{background:var(--good-bg);color:var(--good);border-color:transparent}.again{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.fb{margin:12px 0;padding:12px 14px;border-radius:10px;font-weight:500}.fb.ok{background:var(--good-bg);color:var(--good)}.fb.no{background:var(--bad-bg);color:var(--bad)}
.score{font:700 clamp(40px,12vw,64px)/1 var(--font-display);margin:18px 0 6px}
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:30}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);color:var(--fg);border-radius:16px 16px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.sheet h2{font-size:20px;margin-bottom:14px}.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
@media(min-width:640px){.sheet{left:50%;right:auto;bottom:auto;top:6vh;width:540px;max-width:calc(100vw - 32px);transform:translateX(-50%);border-radius:16px}}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:8px;border:2px solid var(--line);background:var(--c);cursor:pointer}.sw button[aria-pressed=true]{border-color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:500;max-width:calc(100% - 32px)}
.ocr-panel{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);margin-bottom:14px}
.ocr-panel .shot img{max-height:42vh}
@media(prefers-reduced-motion:reduce){.fc-in{transition:none}.spin{animation:none}}
</style>
<script>
(function(){try{var t=localStorage.getItem('fiszkownik.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();

<body>
<div class="wrap">
  <header class="bar">
    <button class="brand" data-act="home" type="button"><span class="hl">Fiszkownik</span></button>
    <div class="bar-right">
      <button id="status" class="status" data-act="retry" data-s="local" type="button"><i></i><span>Tryb lokalny</span></button>
      <button id="btn-open-login" class="acct-btn" data-act="open-login" type="button">Logowanie</button>
      <button id="btn-open-reg" class="acct-btn primary-pill" data-act="open-register" type="button">Rejestracja</button>
      <button id="btn-user-profile" class="acct-btn logged" data-act="open-profile" type="button" hidden>
        <svg class="ic" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20c1.5-4 12.5-4 14 0"/></svg>
        <span id="user-label"></span>
      </button>
      <button id="btn-theme" class="theme-btn" data-act="toggle-theme" type="button" title="Zmień motyw (jasny / ciemny)" aria-label="Zmień motyw (jasny / ciemny)"></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="sheets"></div>
<div id="toast" class="toast" role="status" hidden></div>

  authDomain: "fiszkownik.firebaseapp.com",
  projectId: "fiszkownik",
  storageBucket: "fiszkownik.firebasestorage.app",
  messagingSenderId: "912847791090",
  appId: "1:912847791090:web:500a08fb544c79dbf3416b",

function cleanVocabTerm(str) {
  return String(str || '')
    .replace(/^[\s\-–—=:→•·*|\\\/.,;!?()\[\]{}"„”'’«»]+/, '')
    .replace(/[\s\-–—=:→•·*|\\\/.,;!?()\[\]{}"„”'’«»]+$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function splitBilingualLine(line, defaultDir) {
  const raw = String(line || '').trim();
  if (!raw) return null;

  // 1. Wyraźny separator między słowem a tłumaczeniem (myślnik, półpauza, pauza, dwukropek, znak równości, strzałka, tabulator, pionowa kreska)
  const sepMatch = raw.match(/^(.+?)\s*(?:\t|\s*[-–—=:→]\s*|\s*->\s*|\s*\|\s*)\s*(.+)$/);
  if (sepMatch) {
    const left = cleanVocabTerm(sepMatch[1]);
    const right = cleanVocabTerm(sepMatch[2]);
    if (left && right) {
      if (defaultDir === 'pl-de') return { de: right, pl: left, bilingual: true };
      return { de: left, pl: right, bilingual: true };
    }
  }

  // 2. Zapis z nawiasem na końcu, np. "der Apfel (jabłko)" lub "jabłko (der Apfel)"
  const parenMatch = raw.match(/^([^(]+?)\s*\(([^)]+)\)\s*$/);
  if (parenMatch) {
    const outPart = cleanVocabTerm(parenMatch[1]);
    const inPart = cleanVocabTerm(parenMatch[2]);
    if (outPart && inPart && /[a-zA-ZäöüÄÖÜßąćęłńóśźżĄĆĘŁŃÓŚŹŻ]{2,}/.test(inPart)) {
      if (defaultDir === 'pl-de') return { de: inPart, pl: outPart, bilingual: true };
      return { de: outPart, pl: inPart, bilingual: true };
    }
  }

  // 3. Brak separatora, ale w jednej linii występują dwie kolumny oddzielone większym odstępem
  const hasPlDiacritics = /[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/;
  const hasDeMarker = /(?:^|\s)(?:der|die|das|ein|eine|sich|etw\.|jdn\.|jdm\.)(?:\s|$)|[äöüÄÖÜß]/i;
  const multiSpace = raw.split(/\s{2,}/).map(x => cleanVocabTerm(x)).filter(Boolean);
  if (multiSpace.length === 2) {
    const [a, b] = multiSpace;
    if (hasPlDiacritics.test(b) && !hasPlDiacritics.test(a)) return { de: a, pl: b, bilingual: true };
    if (hasPlDiacritics.test(a) && !hasPlDiacritics.test(b)) return { de: b, pl: a, bilingual: true };
    if (hasDeMarker.test(a) && !hasDeMarker.test(b)) return { de: a, pl: b, bilingual: true };
    if (hasDeMarker.test(b) && !hasDeMarker.test(a)) return { de: b, pl: a, bilingual: true };
    return defaultDir === 'pl-de'
      ? { de: b, pl: a, bilingual: true }
      : { de: a, pl: b, bilingual: true };
  }

  // 4. Pojedyncza linia bez separatora zawierająca jednocześnie wyrazy niemieckie i polskie (np. "der Apfel jabłko")
  if (hasDeMarker.test(raw) && hasPlDiacritics.test(raw)) {
    const tokens = raw.split(/\s+/);
    let splitIdx = -1;
    for (let i = 1; i < tokens.length; i++) {
      const leftPart = tokens.slice(0, i).join(' ');
      const rightPart = tokens.slice(i).join(' ');
      if ((hasDeMarker.test(leftPart) && !hasPlDiacritics.test(leftPart) && hasPlDiacritics.test(rightPart)) ||
          (hasPlDiacritics.test(leftPart) && !hasDeMarker.test(leftPart) && hasDeMarker.test(rightPart))) {
        splitIdx = i;
        break;
      }
    }
    if (splitIdx > 0) {
      const leftPart = cleanVocabTerm(tokens.slice(0, splitIdx).join(' '));
      const rightPart = cleanVocabTerm(tokens.slice(splitIdx).join(' '));
      if (leftPart && rightPart) {
        if (hasPlDiacritics.test(leftPart) && !hasPlDiacritics.test(rightPart)) {
          return { de: rightPart, pl: leftPart, bilingual: true };
        }
        return { de: leftPart, pl: rightPart, bilingual: true };
      }
    }
  }

  return null;
}

async function recognizeAndParseCanvas(canvas, langHint, onProgress) {
  const defaultDir = langHint === 'pl' ? 'pl-de' : 'de-pl';

  if (app.sample) {
    const blob = await new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('Blob error')), 'image/jpeg', 0.92));
    const r = await app.sample.json(
      'Extract vocabulary items from the image accurately. ' +
      'IMPORTANT RULES: ' +
      '1. NEVER translate anything automatically! Only transcribe the exact words visible in the highlighted image. ' +
      '2. Strip all separating punctuation such as dashes (-, –, —), colons (:), equals signs (=), arrows, or surrounding parentheses from the extracted words so both fields contain clean words only. ' +
      '3. If the highlighted image contains BOTH the German word AND its Polish translation side by side (e.g. "der Hund - pies", "der Hund: pies", "laufen biegnąć"), put the clean German part into "de", the clean Polish part into "pl", and set "bilingual": true. ' +
      '4. If the highlighted image contains ONLY ONE language (e.g. only the German word without Polish translation), put the clean extracted word into "de" (or "pl" if Polish), leave the other field completely empty "", and set "bilingual": false. ' +
      'Reply ONLY with JSON: {"items": [{"de": string, "pl": string, "bilingual": boolean}]}',
      { images: blob, modelTier: 'quick' }
    );
    if (r && Array.isArray(r.items) && r.items.length) {
      return r.items.map(it => {
        const de = cleanVocabTerm(it.de);
        const pl = cleanVocabTerm(it.pl);
        return {
          de,
          pl,
          bilingual: !!(de && pl)
        };
      }).filter(it => it.de || it.pl);
    }
  }

  if (typeof Tesseract === 'undefined') {
    throw new Error('Brak biblioteki OCR. Sprawdź połączenie z internetem.');
  }

  const result = await Tesseract.recognize(canvas, 'deu+pol', {
    logger: m => {
      if (onProgress && m.status === 'recognizing text') {
        onProgress(Math.round((m.progress || 0) * 100));
      }
    }
  });
  const rawText = (result && result.data && result.data.text) ? result.data.text : '';
  const lines = rawText.split(/\r?\n/).map(l => l.replace(/[ \t]+/g, ' ').trim()).filter(Boolean);
  const items = [];

  for (const line of lines) {
    const pair = splitBilingualLine(line, defaultDir);
    if (pair) {
      items.push(pair);
    } else {
      const cleanSingle = cleanVocabTerm(line);
      if (cleanSingle) {
        items.push({
          de: defaultDir === 'de-pl' ? cleanSingle : '',
          pl: defaultDir === 'pl-de' ? cleanSingle : '',
          bilingual: false
        });
      }
    }
  }
  return items;
}

function cropRectToCanvas(sourceCanvas, rect) {
  const W = sourceCanvas.width;
  const H = sourceCanvas.height;
  const sx = Math.max(0, Math.round(rect.x * W));
  const sy = Math.max(0, Math.round(rect.y * H));
  const sw = Math.max(8, Math.round(rect.w * W));
  const sh = Math.max(8, Math.round(rect.h * H));

  const scale = sw < 500 ? 2 : 1;
  const out = document.createElement('canvas');
  out.width = sw * scale;
  out.height = sh * scale;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(sourceCanvas, sx, sy, sw, sh, 0, 0, out.width, out.height);
  return out;
}

// Grupuje zamalowane pociągnięcia pędzla w osobne fiszki (jeśli pociągnięcia się stykają -> 1 fiszka; jeśli są osobno -> osobne fiszki)
function groupStrokesIntoRegions(strokes) {
  if (!strokes || !strokes.length) return [];
  const boxes = strokes.map((st, idx) => {
    if (st.fullImage) {
      return { idx, x1: 0, y1: 0, x2: 1, y2: 1, fullImage: true, strokes: [st] };
    }
    const r = st.r || 0.024;
    let minX = 1, minY = 1, maxX = 0, maxY = 0;
    for (const p of st.pts) {
      if (p.x - r < minX) minX = p.x - r;
      if (p.x + r > maxX) maxX = p.x + r;
      if (p.y - r * 0.7 < minY) minY = p.y - r * 0.7;
      if (p.y + r * 0.7 > maxY) maxY = p.y + r * 0.7;
    }
    return {
      idx,
      x1: clamp(minX),
      y1: clamp(minY),
      x2: clamp(maxX),
      y2: clamp(maxY),
      fullImage: false,
      strokes: [st]
    };
  });

  const strokesTouch = (a, b) => {
    if (a.fullImage || b.fullImage) return true;
    const padX = 0.003;
    const padY = 0.002;
    if (a.x2 + padX < b.x1 || b.x2 + padX < a.x1 || a.y2 + padY < b.y1 || b.y2 + padY < a.y1) {
      return false;
    }
    for (const sa of a.strokes) {
      for (const sb of b.strokes) {
        const thresh = ((sa.r || 0.024) + (sb.r || 0.024)) * 0.85;
        for (const pa of sa.pts) {
          for (const pb of sb.pts) {
            const dx = pa.x - pb.x;
            const dy = pa.y - pb.y;
            if (dx * dx + dy * dy <= thresh * thresh) return true;
          }
        }
      }
    }
    return false;
  };

  let merged = true;
  while (merged) {
    merged = false;
    for (let i = 0; i < boxes.length; i++) {
      for (let j = i + 1; j < boxes.length; j++) {
        if (strokesTouch(boxes[i], boxes[j])) {
          boxes[i].x1 = Math.min(boxes[i].x1, boxes[j].x1);
          boxes[i].y1 = Math.min(boxes[i].y1, boxes[j].y1);
          boxes[i].x2 = Math.max(boxes[i].x2, boxes[j].x2);
          boxes[i].y2 = Math.max(boxes[i].y2, boxes[j].y2);
          boxes[i].fullImage = boxes[i].fullImage || boxes[j].fullImage;
          boxes[i].strokes.push(...boxes[j].strokes);
          boxes.splice(j, 1);
          merged = true;
          break;
        }
      }
      if (merged) break;
    }
  }

  boxes.sort((a, b) => {
    const rowDiff = a.y1 - b.y1;
    if (Math.abs(rowDiff) > 0.022) return rowDiff;
    return a.x1 - b.x1;
  });

  return boxes.map(b => ({
    x: clamp(b.x1 - 0.006),
    y: clamp(b.y1 - 0.006),
    w: Math.max(0.015, Math.min(1 - clamp(b.x1 - 0.006), (b.x2 - b.x1) + 0.012)),
    h: Math.max(0.012, Math.min(1 - clamp(b.y1 - 0.006), (b.y2 - b.y1) + 0.012)),
    fullImage: !!b.fullImage,
    strokes: b.strokes
  }));
}

function cropMaskedGroupToCanvas(sourceCanvas, group) {
  if (group.fullImage) return sourceCanvas;
  const W = sourceCanvas.width;
  const H = sourceCanvas.height;
  const sx = Math.max(0, Math.round(group.x * W));
  const sy = Math.max(0, Math.round(group.y * H));
  const sw = Math.max(10, Math.round(group.w * W));
  const sh = Math.max(10, Math.round(group.h * H));

  const scale = sw < 500 ? 2 : 1;
  const outW = sw * scale;
  const outH = sh * scale;

  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = outW;
  maskCanvas.height = outH;
  const mctx = maskCanvas.getContext('2d');
  mctx.lineCap = 'round';
  mctx.lineJoin = 'round';
  mctx.strokeStyle = '#000000';
  mctx.fillStyle = '#000000';

  for (const st of group.strokes) {
    const lineW = Math.max(12, (st.r || 0.024) * 2 * W * scale * 1.15);
    mctx.lineWidth = lineW;
    if (st.pts.length === 1) {
      const px = (st.pts[0].x * W - sx) * scale;
      const py = (st.pts[0].y * H - sy) * scale;
      mctx.beginPath();
      mctx.arc(px, py, lineW / 2, 0, Math.PI * 2);
      mctx.fill();
    } else if (st.pts.length > 1) {
      mctx.beginPath();
      st.pts.forEach((p, idx) => {
        const px = (p.x * W - sx) * scale;
        const py = (p.y * H - sy) * scale;
        if (idx === 0) mctx.moveTo(px, py);
        else mctx.lineTo(px, py);
      });
      mctx.stroke();
    }
  }

  mctx.globalCompositeOperation = 'source-in';
  mctx.drawImage(sourceCanvas, sx, sy, sw, sh, 0, 0, outW, outH);

  const out = document.createElement('canvas');
  out.width = outW;
  out.height = outH;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, outW, outH);
  ctx.drawImage(maskCanvas, 0, 0);
  return out;
}

function renderBrushOverlay(canvasEl, strokes, activeStroke, groups) {
  if (!canvasEl) return;
  const w = canvasEl.width;
  const h = canvasEl.height;
  const ctx = canvasEl.getContext('2d');
  ctx.clearRect(0, 0, w, h);

  const drawStroke = (st) => {
    if (!st) return;
    if (st.fullImage) {
      ctx.save();
      ctx.fillStyle = 'rgba(255, 212, 59, 0.32)';
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
      return;
    }
    if (!st.pts || !st.pts.length) return;
    const lw = Math.max(10, (st.r || 0.024) * 2 * w);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255, 212, 59, 0.48)';
    ctx.fillStyle = 'rgba(255, 212, 59, 0.48)';
    ctx.lineWidth = lw;
    if (st.pts.length === 1) {
      ctx.beginPath();
      ctx.arc(st.pts[0].x * w, st.pts[0].y * h, lw / 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.beginPath();
      st.pts.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.x * w, p.y * h);
        else ctx.lineTo(p.x * w, p.y * h);
      });
      ctx.stroke();
    }
    ctx.restore();
  };

  (strokes || []).forEach(drawStroke);
  if (activeStroke) drawStroke(activeStroke);

  if (groups && groups.length) {
    groups.forEach((g, idx) => {
      const bx = Math.max(2, g.x * w);
      const by = Math.max(2, g.y * h);
      const label = String(idx + 1);
      ctx.save();
      ctx.font = 'bold ' + Math.max(13, Math.round(w * 0.018)) + 'px Inter, sans-serif';
      const tw = ctx.measureText(label).width + 10;
      const th = Math.max(18, Math.round(w * 0.024));
      ctx.fillStyle = '#FFD43B';
      ctx.strokeStyle = '#E9B800';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, by, tw, th, 4);
      else ctx.rect(bx, by, tw, th);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#2E2500';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, bx + 5, by + th / 2 + 1);
      ctx.restore();
    });
  }
}

const cloud = { user: null, isCloud: false, unsub: null, dirty: false, timer: null, busy: false, isNewRegistration: false };
const STATUS = {
  synced: 'Zapisano w chmurze',
  local_account: 'Konto lokalne (zapisane)',
  local: 'Tryb gościa (niezalogowano)',
  saving: 'Zapisywanie…',
  error: 'Błąd zapisu w chmurze'
};

function setStatus(s) {
  const b = $('#status');
  if (!b) return;
  b.dataset.s = s;
  b.lastChild.textContent = STATUS[s] || STATUS.local;
}

function updateHeaderAuthUI() {
  const btnLogin = $('#btn-open-login');
  const btnReg = $('#btn-open-reg');
  const btnProfile = $('#btn-user-profile');
  const userLabel = $('#user-label');

  if (cloud.user) {
    btnLogin.hidden = true;
    btnReg.hidden = true;
    btnProfile.hidden = false;
    userLabel.textContent = 'Witaj, ' + cloud.user.email;
    btnProfile.title = 'Witaj, ' + cloud.user.email + ' (kliknij, aby wylogować)';
  } else {
    btnLogin.hidden = false;
    btnReg.hidden = false;
    btnProfile.hidden = true;
    userLabel.textContent = '';
  }
}

function getLocalAccounts() {
  try {
    return JSON.parse(localStorage.getItem(LS_ACCOUNTS) || '{}');
  } catch (e) {
    return {};
  }
}

function saveLocalAccounts(accs) {
  try {
    localStorage.setItem(LS_ACCOUNTS, JSON.stringify(accs));
  } catch (e) {}
}

function applyUserSession(userObj, isCloudUser) {
  if (cloud.unsub) { cloud.unsub(); cloud.unsub = null; }
  cloud.user = userObj;
  cloud.isCloud = !!isCloudUser;
  updateHeaderAuthUI();

  if (userObj) {
    try { localStorage.setItem(LS_CURRENT_USER, JSON.stringify({ email: userObj.email, uid: userObj.uid })); } catch (e) {}

    if (cloud.isNewRegistration) {
      cloud.isNewRegistration = false;
      state.folders = [];
      state.activeSession = null;
      saveLocal();
      fixView();
      render();
      if (isCloudUser) queuePush();
      else setStatus('local_account');
    } else {
      const userLocalData = loadLocal();
      state.folders = userLocalData ? userLocalData.folders : [];
      state.activeSession = userLocalData ? userLocalData.activeSession : null;
      fixView();
      render();
      setStatus(isCloudUser ? 'saving' : 'local_account');
    }

    if (isCloudUser && db && userObj.uid) {
      const ref = doc(db, 'users', userObj.uid);
      cloud.unsub = onSnapshot(ref, snap => {
        if (cloud.busy || cloud.dirty) return;
        if (snap.exists()) {
          const d = snap.data();
          const remoteFolders = Array.isArray(d.folders) ? d.folders : [];
          const remoteSession = d.activeSession || null;
          if (JSON.stringify(remoteFolders) !== JSON.stringify(state.folders) || JSON.stringify(remoteSession) !== JSON.stringify(state.activeSession)) {
            state.folders = remoteFolders;
            state.activeSession = remoteSession;
            saveLocal();
            fixView();
            render();
          }
          setStatus('synced');
        } else {
          queuePush();
        }
      }, err => {
        console.warn('Firestore snapshot warning:', err);
        setStatus('local_account');
      });
    }
  } else {
    try { localStorage.removeItem(LS_CURRENT_USER); } catch (e) {}
    const guestData = loadLocal();
    state.folders = guestData ? guestData.folders : [];
    state.activeSession = guestData ? guestData.activeSession : null;
    fixView();
    render();
    setStatus('local');
  }
}

function touch() {
  saveLocal();
  if (cloud.user && cloud.isCloud) {
    cloud.dirty = true;
    queuePush();
  } else if (cloud.user) {
    setStatus('local_account');
  } else {
    setStatus('local');
  }
}

function queuePush() {
  if (!cloud.user || !cloud.isCloud) return;
  setStatus('saving');
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(pushCloud, 400);
}

async function pushCloud() {
  if (!cloud.user || !cloud.isCloud || cloud.busy) return;
  cloud.busy = true;
  cloud.dirty = false;
  try {
    const ref = doc(db, 'users', cloud.user.uid);
    await setDoc(ref, {
      folders: state.folders,
      activeSession: state.activeSession,
      updatedAt: Date.now()
    }, { merge: true });
    setStatus('synced');
  } catch (e) {
    console.warn('Firestore write warning:', e);
    setStatus('local_account');
  } finally {
    cloud.busy = false;
    if (cloud.dirty) queuePush();
  }
}

function authErrorMsg(code) {
  switch (code) {
    case 'auth/invalid-email': return 'Nieprawidłowy format adresu e-mail.';
    case 'auth/user-disabled': return 'To konto zostało zablokowane.';
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential': return 'Błędny adres e-mail lub hasło.';
    case 'auth/email-already-in-use': return 'Konto z tym adresem e-mail już istnieje. Użyj przycisku „Logowanie”.';
    case 'auth/weak-password': return 'Hasło musi mieć co najmniej 6 znaków.';
    case 'auth/too-many-requests': return 'Zbyt wiele nieudanych prób. Spróbuj później.';
    default: return 'Błąd logowania (' + code + ').';
  }
}

let view = { n: 'home' }, scan = null, study = null;
const app = { sample: null, caps: null, probed: false };

function toast(m) {
  const t = $('#toast');
  t.textContent = m;
  t.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { t.hidden = true }, 3200);
}

function nav(v) {
  if (v.n !== 'scan' && scan) {
    if (scan.ctl) scan.ctl.abort();
    if (scan.url) URL.revokeObjectURL(scan.url);
    scan = null;
  }
  if (v.n !== 'study' && study) {
    if (study.phase === 'run') saveActiveSession();
    study = null;
  }
  view = v;
  window.scrollTo(0, 0);
  render();
}

function fixView() {
  if (view.n === 'folder' && !getF(view.f)) view = { n: 'home' };
  if (view.n === 'set' && !getS(view.f, view.s)) view = getF(view.f) ? { n: 'folder', f: view.f } : { n: 'home' };
}

function openSheet(html, mount) {
  $('#sheets').innerHTML = '<div class="scrim" data-act="sheet-x"></div><div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  const sh = $('#sheets .sheet');
  if (mount) mount(sh);
  const i = sh.querySelector('input,select');

}

function closeSheet() { $('#sheets').innerHTML = '' }

function confirmSheet(title, text, ok, fn) {
  openSheet('<h2>' + esc(title) + '</h2><p class="muted">' + esc(text) + '</p><div class="sheet-actions"><button class="btn" data-act="sheet-x">Anuluj</button><button class="btn danger" id="cf-ok">' + esc(ok) + '</button></div>', sh => {

const crumbs = a => '<nav class="crumbs" aria-label="Ścieżka">' + a.map((x, i) => (i ? '<span aria-hidden="true">›</span>' : '') + '<button data-act="nav" data-n="' + x[0] + '"' + (x[1] ? ' data-f="' + x[1] + '"' : '') + (x[2] ? ' data-s="' + x[2] + '"' : '') + '>' + esc(x[3]) + '</button>').join('') + '</nav>';

function resumeBannerHtml(filterFid, filterSid) {
  const ses = state.activeSession;
  if (!ses || !ses.queue || !ses.queue.length || ses.i >= ses.queue.length) return '';
  if (filterFid && ses.fid !== filterFid) return '';
  if (filterSid && ses.sid !== filterSid) return '';
  const f = getF(ses.fid);
  const isFolderScope = (ses.scope === 'folder') || !ses.sid;
  const s = isFolderScope ? null : getS(ses.fid, ses.sid);
  if (!f || (!isFolderScope && !s)) return '';
  const sessionTitle = isFolderScope ? `Cały folder: ${f.name}` : s.name;
  return `
    <div class="resume-box">
      <div>
        <b>Przerwana nauka: ${esc(sessionTitle)}</b>
        <span class="small">Karta ${ses.i + 1} z ${ses.queue.length} · Tryb: ${ses.o.mode === 'flip' ? 'Fiszki' : 'Pisanie'}</span>
      </div>
      <div class="actions">
        <button class="btn sm ghost" data-act="discard-session">Odrzuć</button>
        <button class="btn sm primary" data-act="resume-session">${ic('play')} Wznów</button>
      </div>

  `;
}

  const folderPct = totalCards ? Math.round(f.sets.reduce((sum, item) => sum + item.cards.reduce((a, c) => a + Math.min(3, Math.max(0, c.box | 0)), 0), 0) / (totalCards * 3) * 100) : 0;

function setSheet(fid, s) {
  const opts = state.folders.map(f => '<option value="' + f.id + '"' + (f.id === fid ? ' selected' : '') + '>' + esc(f.name) + '</option>').join('');
  openSheet('<h2>' + (s ? 'Edytuj zestaw' : 'Nowy zestaw') + '</h2><form id="sf"><div class="field"><label for="sf-in">Nazwa</label><input id="sf-in" type="text" maxlength="80" autocomplete="off" value="' + esc(s ? s.name : '') + '"></div>' + (s ? '<div class="field"><label for="mv">Folder</label><select id="mv">' + opts + '</select></div>' : '') + '<div class="sheet-actions">' + (s ? '<button type="button" class="btn danger" id="del">Usuń zestaw</button>' : '') + '<button type="button" class="btn" data-act="sheet-x">Anuluj</button><button class="btn primary">Zapisz</button></div></form>', sh => {
    sh.querySelector('#sf').addEventListener('submit', e => {
      e.preventDefault(); const v = $('#sf-in').value.trim(); if (!v) { $('#sf-in').focus(); return }
      closeSheet();
      if (!s) { const n = addSet(fid, v); nav({ n: 'set', f: fid, s: n.id }); return }
      s.name = v; const to = $('#mv').value;
      if (to !== fid) {
        const a = getF(fid), b = getF(to);
        a.sets = a.sets.filter(x => x.id !== s.id);
        b.sets.push(s);
        if (state.activeSession && state.activeSession.sid === s.id) state.activeSession.fid = to;
        touch(); nav({ n: 'set', f: to, s: s.id });
      } else { touch(); render() }
    });
    const d = sh.querySelector('#del');
    if (d) d.addEventListener('click', () => confirmSheet('Usunąć zestaw?', 'Zestaw „' + s.name + '” i jego fiszki zostaną usunięte.', 'Usuń', () => {
      const f = getF(fid);
      f.sets = f.sets.filter(x => x.id !== s.id);
      if (state.activeSession && state.activeSession.sid === s.id) state.activeSession = null;
      touch(); nav({ n: 'folder', f: fid }); toast('Zestaw usunięty');
    }));
  });
}

      <button type="button" class="btn sm primary" id="cs-cam">${ic('camera')} Zrób zdjęcie (aparat)</button>
      <button type="button" class="btn sm" id="cs-gal">${ic('img')} Wybierz z galerii</button>
      <input type="file" id="cs-fcam" class="vh" accept="image/*" capture="environment" tabindex="-1">
      <input type="file" id="cs-fgal" class="vh" accept="image/*" tabindex="-1">
    </div>

    <div id="cs-ocr-box" class="ocr-panel" hidden>
      <div class="zoom-bar">
        <div class="zoom-grp">
          <button type="button" class="btn xs" id="cs-z-out" title="Oddal">−</button>
          <span class="zoom-val" id="cs-z-val">100%</span>
          <button type="button" class="btn xs" id="cs-z-in" title="Przybliż">+</button>
          <button type="button" class="btn xs" id="cs-z-rst" title="Dopasuj">1:1</button>
        </div>
        <div class="zoom-grp">
          <button type="button" class="btn xs active" id="cs-mode-draw">Zamaluj</button>
          <button type="button" class="btn xs" id="cs-mode-pan">Przesuń</button>
        </div>
        <div class="zoom-grp">
          <span class="small" style="font-size:11px">Grubość:</span>
          <button type="button" class="btn xs" id="cs-br-s" data-br="0.015">S</button>
          <button type="button" class="btn xs active" id="cs-br-m" data-br="0.024">M</button>
          <button type="button" class="btn xs" id="cs-br-l" data-br="0.038">L</button>
        </div>
      </div>
      <div class="stage" id="cs-stage">
        <div class="shot" id="cs-shot" style="width:100%">
          <img id="cs-img" alt="Wybrane zdjęcie" draggable="false">
          <div id="cs-ov" class="ov"><canvas id="cs-bcv"></canvas></div>
        </div>
      </div>
      <div class="tools" style="margin-bottom:8px">
        <button type="button" class="btn sm primary" id="cs-read" disabled>Wczytaj zaznaczone</button>
        <button type="button" class="btn sm" id="cs-sel-undo">Cofnij</button>
        <button type="button" class="btn sm" id="cs-sel-clear">Wyczyść</button>
        <button type="button" class="btn sm ghost" id="cs-ocr-hide">Schowaj zdjęcie</button>
      </div>
      <div id="cs-target-wrap" class="field" style="margin-bottom:0" hidden>
        <label for="cs-target-row">Wczytaj pojedyncze zaznaczenie do fiszki</label>
        <select id="cs-target-row"></select>
      </div>
    </div>

    <form id="sf">
      <div id="cs-rows"></div>
      <p class="small" id="c-msg" aria-live="polite" style="font-weight:500"></p>
      <div class="sheet-actions">
        ${c ? '<button type="button" class="btn danger" id="del">Usuń fiszkę</button>' : ''}
        <button type="button" class="btn" id="cs-cancel">Anuluj</button>
        <button class="btn primary" id="cs-submit">${c ? 'Zapisz fiszkę' : 'Zapisz fiszkę'}</button>
      </div>
    </form>
  `, sh => {
    const g = i => $(i, sh);
    const msgEl = g('#c-msg');
    const ocrBox = g('#cs-ocr-box');
    const stageEl = g('#cs-stage');
    const shotEl = g('#cs-shot');
    const imgEl = g('#cs-img');
    const ovEl = g('#cs-ov');
    const bcvEl = g('#cs-bcv');
    const readBtn = g('#cs-read');
    const rowsWrap = g('#cs-rows');
    const targetWrap = g('#cs-target-wrap');
    const targetSel = g('#cs-target-row');
    const submitBtn = g('#cs-submit');
    const zValEl = g('#cs-z-val');

    const applyZoom = () => {
      shotEl.style.width = Math.round(ocrState.zoom * 100) + '%';
      zValEl.textContent = Math.round(ocrState.zoom * 100) + '%';
    };

    const syncModeBtns = () => {
      g('#cs-mode-draw').classList.toggle('active', !ocrState.panMode);
      g('#cs-mode-pan').classList.toggle('active', ocrState.panMode);
      ovEl.classList.toggle('pan-mode', ocrState.panMode);
    };

    const syncTargetSelect = () => {
      if (!targetSel || !targetWrap) return;
      if (!rows.some(r => r.id === activeRowId) && rows.length) {
        activeRowId = rows[rows.length - 1].id;
      }
      targetWrap.hidden = rows.length <= 1;
      targetSel.innerHTML = rows.map((r, idx) => {
        const preview = r.de ? ' (' + r.de + ')' : '';
        return '<option value="' + r.id + '"' + (r.id === activeRowId ? ' selected' : '') + '>Fiszka #' + (idx + 1) + esc(preview) + '</option>';
      }).join('');
    };

    const syncSubmitLabel = () => {
      if (!submitBtn) return;
      if (c) {
        submitBtn.textContent = 'Zapisz fiszkę';
      } else {
        submitBtn.textContent = rows.length > 1 ? 'Zapisz fiszki (' + rows.length + ')' : 'Zapisz fiszkę';
      }
    };

    const renderWordRows = (focusNewId) => {
      rowsWrap.innerHTML = rows.map((r, idx) => `
        <div class="cs-card-block" data-wid="${r.id}" style="${idx > 0 ? 'margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);' : ''}">
          ${(!c && (rows.length > 1 || idx > 0)) ? `
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <span class="lab">Fiszka #${idx + 1}</span>
              ${rows.length > 1 ? '<button type="button" class="btn sm ghost danger" data-wact="rem" data-wid="' + r.id + '" title="Usuń tę pozycję" style="min-height:30px;padding:0 8px">' + ic('x') + ' Usuń</button>' : ''}
            </div>
          ` : ''}
          <div class="field">
            <label for="c-de-${r.id}">Niemiecki</label>
            <input id="c-de-${r.id}" type="text" lang="de" autocomplete="off" data-wf="de" data-wid="${r.id}" placeholder="np. der Apfel" value="${esc(r.de)}">
          </div>
          <div class="field">
            <label for="c-pl-${r.id}">Polski (wpisz ręcznie lub wczytaj parę ze zdjęcia)</label>
            <input id="c-pl-${r.id}" type="text" lang="pl" autocomplete="off" data-wf="pl" data-wid="${r.id}" placeholder="np. jabłko" value="${esc(r.pl)}">
          </div>
          <div class="field" style="margin-bottom:${(!c && idx === rows.length - 1) ? '8px' : '12px'}">
            <label for="c-nt-${r.id}">Notatka / przykład (opcjonalnie)</label>
            <input id="c-nt-${r.id}" type="text" autocomplete="off" data-wf="note" data-wid="${r.id}" value="${esc(r.note)}">
          </div>
          ${(!c && idx === rows.length - 1) ? `
            <div style="display:flex;justify-content:flex-start;margin-bottom:8px">
              <button type="button" class="btn sm" data-wact="add" title="Dodaj kolejną fiszkę poniżej">${ic('plus')} Dodaj kolejną fiszkę</button>
            </div>
          ` : ''}
        </div>
      `).join('');

      syncTargetSelect();
      syncSubmitLabel();

      if (focusNewId) {
        const inp = rowsWrap.querySelector('input[data-wf="de"][data-wid="' + focusNewId + '"]');
        if (inp) inp.focus();
      }
    };

    renderWordRows();

    if (targetSel) {
      targetSel.addEventListener('change', () => {
        activeRowId = targetSel.value;
      });
    }

    rowsWrap.addEventListener('focusin', e => {
      const wid = e.target && e.target.dataset && e.target.dataset.wid;
      if (wid) {
        activeRowId = wid;
        syncTargetSelect();
      }
    });

    rowsWrap.addEventListener('input', e => {
      const t = e.target;
      const wid = t && t.dataset && t.dataset.wid;
      const wf = t && t.dataset && t.dataset.wf;
      if (!wid || !wf) return;
      const row = rows.find(x => x.id === wid);
      if (row) {
        row[wf] = t.value;
        if (wf === 'de') syncTargetSelect();
      }
    });

    rowsWrap.addEventListener('click', async e => {
      const btn = e.target.closest('[data-wact]');
      if (!btn) return;
      const act = btn.dataset.wact;
      const wid = btn.dataset.wid;

      if (act === 'add') {
        const newRow = { id: nid('w'), de: '', pl: '', note: '' };
        rows.push(newRow);
        activeRowId = newRow.id;
        renderWordRows(newRow.id);
        return;
      }

      if (act === 'rem') {
        if (rows.length <= 1) return;
        rows = rows.filter(x => x.id !== wid);
        if (activeRowId === wid) activeRowId = rows[rows.length - 1].id;
        renderWordRows();
        return;
      }


    });

    const drawOcrSel = () => {
      const allStrokes = ocrState.activeStroke ? [...ocrState.strokes, ocrState.activeStroke] : ocrState.strokes;
      const groups = groupStrokesIntoRegions(allStrokes);
      renderBrushOverlay(bcvEl, ocrState.strokes, ocrState.activeStroke, groups);
      const count = groups.length;
      readBtn.disabled = !count;
      readBtn.textContent = count > 1
        ? `Wczytaj zaznaczone (${count} fiszki)`
        : (count === 1 ? 'Wczytaj zaznaczone (1 fiszka)' : 'Wczytaj zaznaczone');
    };

    const loadCardImage = file => {
      if (!file) return;
      msgEl.textContent = 'Wczytuję zdjęcie…';
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 1800 / Math.max(im.naturalWidth, im.naturalHeight));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(im.naturalWidth * k));
        cv.height = Math.max(1, Math.round(im.naturalHeight * k));
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(b => {
          if (!b) { msgEl.textContent = 'Nie udało się przetworzyć zdjęcia.'; return; }
          cleanupOcr();
          ocrState.url = URL.createObjectURL(b);
          ocrState.canvas = cv;
          ocrState.strokes = [];
          ocrState.activeStroke = null;
          ocrState.zoom = 1;
          ocrState.panMode = false;
          bcvEl.width = cv.width;
          bcvEl.height = cv.height;
          imgEl.src = ocrState.url;
          ocrBox.hidden = false;
          applyZoom();
          syncModeBtns();
          msgEl.textContent = 'Przybliż zdjęcie i zamaluj samo słowo niemieckie (polskie wpiszesz ręcznie) albo niemieckie razem z polskim obok (oba wstawią się bez myślników i dwukropków).';
          drawOcrSel();
        }, 'image/jpeg', 0.92);
      };
      im.onerror = () => {
        URL.revokeObjectURL(url);
        msgEl.textContent = 'Nie udało się otworzyć pliku ze zdjęciem.';
      };
      im.src = url;
    };

    g('#cs-cam').onclick = () => g('#cs-fcam').click();
    g('#cs-gal').onclick = () => g('#cs-fgal').click();
    g('#cs-fcam').onchange = e => { loadCardImage(e.target.files && e.target.files[0]); e.target.value = ''; };
    g('#cs-fgal').onchange = e => { loadCardImage(e.target.files && e.target.files[0]); e.target.value = ''; };
    g('#cs-ocr-hide').onclick = () => { ocrBox.hidden = true; };
    g('#cs-sel-clear').onclick = () => { ocrState.strokes = []; ocrState.activeStroke = null; drawOcrSel(); };
    g('#cs-sel-undo').onclick = () => { ocrState.strokes.pop(); drawOcrSel(); };

    g('#cs-z-in').onclick = () => { ocrState.zoom = Math.min(3.5, +(ocrState.zoom + 0.35).toFixed(2)); applyZoom(); };
    g('#cs-z-out').onclick = () => { ocrState.zoom = Math.max(1, +(ocrState.zoom - 0.35).toFixed(2)); applyZoom(); };
    g('#cs-z-rst').onclick = () => { ocrState.zoom = 1; applyZoom(); };
    g('#cs-mode-draw').onclick = () => { ocrState.panMode = false; syncModeBtns(); };
    g('#cs-mode-pan').onclick = () => { ocrState.panMode = true; syncModeBtns(); };

    ['#cs-br-s', '#cs-br-m', '#cs-br-l'].forEach(sel => {
      const btn = g(sel);
      if (btn) btn.onclick = () => {
        ocrState.brushR = parseFloat(btn.dataset.br);
        ['#cs-br-s', '#cs-br-m', '#cs-br-l'].forEach(s2 => g(s2).classList.remove('active'));
        btn.classList.add('active');
      };
    });

    let pinchStartDist = 0, pinchStartZoom = 1;
    stageEl.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        ocrState.activeStroke = null;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDist = Math.hypot(dx, dy);
        pinchStartZoom = ocrState.zoom;
      }
    }, { passive: true });
    stageEl.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinchStartDist > 0) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        ocrState.zoom = Math.max(1, Math.min(3.5, +(pinchStartZoom * (dist / pinchStartDist)).toFixed(2)));
        applyZoom();
      }
    }, { passive: true });
    stageEl.addEventListener('touchend', () => { pinchStartDist = 0; }, { passive: true });

    const getPt = e => {
      const r = ovEl.getBoundingClientRect();
      return { x: clamp((e.clientX - r.left) / r.width), y: clamp((e.clientY - r.top) / r.height) };
    };
    ovEl.addEventListener('pointerdown', e => {
      if (ocrState.panMode) return;
      if (e.pointerType === 'touch' && !e.isPrimary) return;
      e.preventDefault();
      ovEl.setPointerCapture(e.pointerId);
      const p = getPt(e);
      ocrState.activeStroke = { r: ocrState.brushR / ocrState.zoom, pts: [p] };
      drawOcrSel();
    });
    ovEl.addEventListener('pointermove', e => {
      if (!ocrState.activeStroke) return;
      const p = getPt(e);
      const last = ocrState.activeStroke.pts[ocrState.activeStroke.pts.length - 1];
      if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 0.002) {
        ocrState.activeStroke.pts.push(p);
        drawOcrSel();
      }
    });
    const finishStroke = () => {
      if (!ocrState.activeStroke) return;
      ocrState.strokes.push(ocrState.activeStroke);
      ocrState.activeStroke = null;
      drawOcrSel();
    };
    ovEl.addEventListener('pointerup', finishStroke);
    ovEl.addEventListener('pointercancel', finishStroke);

    readBtn.onclick = async () => {
      const groups = groupStrokesIntoRegions(ocrState.strokes);
      if (!ocrState.canvas || !groups.length) return;
      ocrState.strokes = [];
      ocrState.activeStroke = null;
      drawOcrSel();
      readBtn.disabled = true;
      let addedCount = 0;
      try {
        for (let gi = 0; gi < groups.length; gi++) {
          msgEl.textContent = `Odczytuję fragment ${gi + 1} z ${groups.length}…`;
          const crop = cropMaskedGroupToCanvas(ocrState.canvas, groups[gi]);
          const parsedItems = await recognizeAndParseCanvas(crop, 'de', pct => {
            msgEl.textContent = `Fragment ${gi + 1}/${groups.length}: rozpoznawanie ${pct}%…`;
          });
          if (!parsedItems.length) continue;

          for (const item of parsedItems) {
            let targetRow = null;
            if (c) {
              targetRow = rows[0];
            } else {
              const current = rows.find(x => x.id === activeRowId) || rows[rows.length - 1];
              if (current && !current.de.trim() && !current.pl.trim()) {
                targetRow = current;
              } else {
                targetRow = { id: nid('w'), de: '', pl: '', note: '' };
                rows.push(targetRow);
              }
              activeRowId = targetRow.id;
            }

            if (item.bilingual && item.de && item.pl) {
              targetRow.de = item.de;
              targetRow.pl = item.pl;
              msgEl.textContent = `Wczytano parę (${gi + 1}/${groups.length}): „${item.de}” oraz „${item.pl}”…`;
            } else if (item.de) {
              targetRow.de = item.de;
              targetRow.pl = '';
              msgEl.textContent = `Wczytano słowo niemieckie (${gi + 1}/${groups.length}): „${item.de}” — wpisz polskie ręcznie.`;
            } else if (item.pl) {
              targetRow.pl = item.pl;
              targetRow.de = '';
              msgEl.textContent = `Wczytano słowo polskie (${gi + 1}/${groups.length}): „${item.pl}” — wpisz niemieckie ręcznie.`;
            }
            addedCount++;
            renderWordRows();
          }
        }

        if (!addedCount) {
          msgEl.textContent = 'Nie wykryto tekstu w zamalowanych miejscach. Spróbuj przybliżyć i zamalować wyraźniej.';
        } else {
          const missingPl = rows.filter(r => r.de.trim() && !r.pl.trim()).length;
          if (missingPl > 0) {
            msgEl.textContent = addedCount > 1
              ? `Wczytano ${addedCount} fiszki ze zdjęcia. Uzupełnij ręcznie brakujące polskie tłumaczenia.`
              : 'Wczytano słowo niemieckie ze zdjęcia. Wpisz polskie tłumaczenie ręcznie powyżej.';
          } else {
            msgEl.textContent = addedCount > 1
              ? `Wczytano ${addedCount} gotowe pary DE + PL ze zdjęcia!`
              : 'Wczytano gotową parę DE + PL ze zdjęcia!';
          }
        }
      } catch (err) {
        msgEl.textContent = err.message || 'Błąd podczas odczytu ze zdjęcia.';
      } finally {
        drawOcrSel();
      }
    };

    g('#cs-cancel').onclick = () => { cleanupOcr(); closeSheet(); };

    sh.querySelector('#sf').addEventListener('submit', e => {
      e.preventDefault();
      if (c) {
        const r = rows[0];
        const de = r.de.trim(), pl = r.pl.trim();
        if (!de || !pl) { msgEl.textContent = 'Wpisz obie strony fiszki (niemiecki i polski).'; return; }
        c.de = de;
        c.pl = pl;
        c.note = r.note.trim();
      } else {
        const nonEmpty = rows.filter(r => r.de.trim() || r.pl.trim() || r.note.trim());
        if (!nonEmpty.length) {
          msgEl.textContent = 'Wpisz obie strony fiszki (niemiecki i polski).';
          return;
        }
        if (nonEmpty.some(r => !r.de.trim() || !r.pl.trim())) {
          msgEl.textContent = 'Uzupełnij obie strony (niemiecki i polski) w każdej dodawanej fiszce.';
          return;
        }
        const s = getS(fid, sid);
        nonEmpty.forEach(r => {
          s.cards.push(newCard(r.de, r.pl, r.note));
        });
      }
      cleanupOcr();
      closeSheet();
      touch();
      render();
    });

    const d = g('#del');
    if (d) d.addEventListener('click', () => {
      const s = getS(fid, sid);
      s.cards = s.cards.filter(x => x.id !== c.id);
      cleanupOcr();
      closeSheet();
      touch();
      render();
    });
  });
}

function errCopy(e) { const m = errCopy0(e), d = e && (e.code || e.message); return d ? m + ' (szczegóły: ' + d + ')' : m }
function errCopy0(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled') return 'Brak zgody na AI w tym środowisku.';
  if (c === 'rate_limited') return 'Za dużo zapytań naraz. Spróbuj ponownie za chwilę.';
  if (c === 'image_rejected') return 'Nie mogę odczytać tego zdjęcia. Spróbuj innego pliku.';
  return 'Coś poszło nie tak. Spróbuj ponownie.';
}

async function probeSample() {
  try { const c = window.claude; const s = c && c.use ? await c.use('sample') : null; app.sample = s || null; if (s) app.caps = await s.limits().catch(() => null) } catch (e) { app.sample = null }
  app.probed = true; if (view.n === 'scan' && scan && scan.phase === 'pick') render();
}

function startScan() {
  const back = view.n === 'scan' ? { n: 'home' } : view;
  scan = {
    phase: 'pick', back, url: null, img: null, strokes: [], activeStroke: null, zoom: 1, panMode: false, brushR: 0.024, hint: 'de', rows: [], err: '', ctl: null,
    dest: { fid: view.n === 'set' || view.n === 'folder' ? view.f : '', sid: view.n === 'set' ? view.s : '', newFolder: '', newSet: '' }
  };
  nav({ n: 'scan' });
}

function endScan() { if (scan && scan.ctl) scan.ctl.abort(); if (scan && scan.url) URL.revokeObjectURL(scan.url); const b = scan ? scan.back : { n: 'home' }; scan = null; nav(b); }

function viewScan() {
  const s = scan, back = '<button class="btn ghost sm" data-act="scan-exit">' + ic('x') + ' Zamknij</button>';
  if (s.phase === 'pick') {
    return '<div class="top">' + back + '</div><h1 class="h1">Fiszki ze zdjęcia</h1><p class="muted">Zrób zdjęcie telefonem albo wybierz zdjęcie z galerii. W następnym kroku przybliżysz zdjęcie i zamalujesz słowa, a każde osobne zamalowanie zamieni się w osobną fiszkę.</p>' +
      (s.err ? '<div class="notice bad">' + esc(s.err) + '</div>' : '') +
      '<div class="actions"><button class="btn primary big" data-act="pick-cam">' + ic('camera') + ' Zrób zdjęcie (aparat)</button><button class="btn big" data-act="pick-gal">' + ic('img') + ' Wybierz z galerii</button></div>' +
      '<input type="file" id="fcam" class="vh" accept="image/*" capture="environment" tabindex="-1"><input type="file" id="fgal" class="vh" accept="image/*" tabindex="-1">';
  }
  if (s.phase === 'select') {
    const hints = [['de', 'Pojedyncze słowo: Niemiecki'], ['pl', 'Pojedyncze słowo: Polski']];
    return '<div class="top">' + back + '</div><h1 class="h1">Zamaluj tekst</h1><p class="muted">Przybliż zdjęcie i zamaluj palcem wybrane słowa. Każde osobno zamalowane słowo utworzy osobną fiszkę.</p>' +
      (s.err ? '<div class="notice bad">' + esc(s.err) + '</div>' : '') +
      '<div class="zoom-bar">' +
        '<div class="zoom-grp">' +
          '<button type="button" class="btn xs" data-act="sc-z-out" title="Oddal">−</button>' +
          '<span class="zoom-val" id="sc-z-val">' + Math.round(s.zoom * 100) + '%</span>' +
          '<button type="button" class="btn xs" data-act="sc-z-in" title="Przybliż">+</button>' +
          '<button type="button" class="btn xs" data-act="sc-z-rst" title="Dopasuj">1:1</button>' +
        '</div>' +
        '<div class="zoom-grp">' +
          '<button type="button" class="btn xs ' + (!s.panMode ? 'active' : '') + '" data-act="sc-mode-draw">Zamaluj</button>' +
          '<button type="button" class="btn xs ' + (s.panMode ? 'active' : '') + '" data-act="sc-mode-pan">Przesuń</button>' +
        '</div>' +
        '<div class="zoom-grp">' +
          '<span class="small" style="font-size:11px">Grubość:</span>' +

          '<button type="button" class="btn xs ' + (s.brushR === 0.024 ? 'active' : '') + '" data-act="sc-br" data-br="0.024">M</button>' +
          '<button type="button" class="btn xs ' + (s.brushR === 0.038 ? 'active' : '') + '" data-act="sc-br" data-br="0.038">L</button>' +
        '</div>' +
      '</div>' +
      '<div class="stage" id="sc-stage"><div class="shot" id="sc-shot" style="width:' + Math.round(s.zoom * 100) + '%"><img src="' + esc(s.url) + '" alt="Twoje zdjęcie" draggable="false"><div id="ov" class="ov' + (s.panMode ? ' pan-mode' : '') + '"><canvas id="sc-bcv" width="' + s.W + '" height="' + s.H + '"></canvas></div></div></div>' +
      '<div id="chips" class="chips"></div>' +
      '<div class="tools"><button class="btn sm" data-act="sel-all">Cały obraz</button><button class="btn sm" data-act="sel-undo">Cofnij</button><button class="btn sm" data-act="sel-clear">Wyczyść</button><button class="btn sm ghost" data-act="rescan">Inne zdjęcie</button></div>' +
      '<div class="field"><span class="lab">Gdy zaznaczasz tylko jeden język</span><div class="seg" role="group">' + hints.map(h => '<button type="button" data-act="hint" data-v="' + h[0] + '" aria-pressed="' + (s.hint === h[0]) + '">' + h[1] + '</button>').join('') + '</div></div>' +
      '<div class="dock"><button id="readbtn" class="btn primary big" data-act="read" disabled>Rozpoznaj tekst</button></div>';
  }
  if (s.phase === 'reading') return '<div class="top">' + back + '</div><div class="empty" style="margin-top:40px"><div class="spin"></div><p id="scan-prog">Odczytuję zamalowany tekst ze zdjęcia…</p><button class="btn" data-act="stop">Zatrzymaj</button></div>';
  const n = s.rows.filter(r => r.on).length;
  return '<div class="top">' + back + '</div><h1 class="h1">Znalezione słowa</h1><p class="muted">Pary niemiecko-polskie zostały wczytane bez znaków rozdzielających. Jeśli zaznaczono tylko słowo niemieckie, wpisz polskie ręcznie przed zapisaniem.</p>' +
    '<div class="tools"><button class="btn sm" data-act="all-on">Zaznacz wszystko</button><button class="btn sm" data-act="all-off">Odznacz wszystko</button><button class="btn sm" data-act="add-row">' + ic('plus') + ' Dodaj wiersz</button><button class="btn sm ghost" data-act="back-select">Wróć do zaznaczania</button></div>' +
    '<div id="rows">' + s.rows.map(rowHtml).join('') + '</div>' +
    '<h2 class="sect">Dokąd dodać</h2><div id="dest"></div>' +
    '<div class="dock"><button id="addbtn" class="btn primary big" data-act="commit">Dodaj ' + n + ' ' + plr(n, 'fiszkę', 'fiszki', 'fiszek') + '</button></div>';
}

function rowHtml(r) {
  return '<div class="row' + (r.on ? '' : ' off') + '" data-r="' + r.id + '"><input type="checkbox" data-in="on" aria-label="Dodaj tę fiszkę"' + (r.on ? ' checked' : '') + '><div class="fields">' +
    '<div class="field"><label>Niemiecki ' + ((r.from === 'de' || r.from === 'both') ? '<span class="tag de">ze zdjęcia</span>' : '<span class="tag de">wpisz ręcznie</span>') + '</label><input type="text" lang="de" placeholder="Wpisz po niemiecku…" data-in="de" value="' + esc(r.de) + '"></div>' +
    '<div class="field"><label>Polski ' + ((r.from === 'pl' || r.from === 'both') ? '<span class="tag pl">ze zdjęcia</span>' : '<span class="tag pl">wpisz ręcznie</span>') + '</label><input type="text" lang="pl" placeholder="Wpisz polskie tłumaczenie…" data-in="pl" value="' + esc(r.pl) + '"></div>' +
    '<div class="field wide"><label>Notatka</label><input type="text" data-in="note" value="' + esc(r.note) + '"></div></div></div>';
