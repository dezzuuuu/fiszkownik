function afterScan() {
  const s = scan;
  if (!s) return;
  if (s.phase === 'pick') {
    ['#fcam', '#fgal'].forEach(id => { const i = $(id); if (i) i.addEventListener('change', e => { onFile(e.target.files && e.target.files[0]); e.target.value = '' }) });
  }
  if (s.phase === 'select') { bindStage(); drawRects() }
  if (s.phase === 'review') { defaultDest(); renderDest() }
}

function onFile(file) {
  if (!file) return;
  const url = URL.createObjectURL(file), im = new Image();
  const fail = () => { try { URL.revokeObjectURL(url) } catch (e) { } if (scan) { scan.err = 'Nie udało się otworzyć tego zdjęcia. Spróbuj ponownie.'; scan.phase = 'pick'; render() } };
  im.onload = () => {
    try {
      const k = Math.min(1, 2200 / Math.max(im.naturalWidth, im.naturalHeight)), cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(im.naturalWidth * k)); cv.height = Math.max(1, Math.round(im.naturalHeight * k));
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b => { if (!b || !scan) { fail(); return } if (scan.url) URL.revokeObjectURL(scan.url); scan.url = URL.createObjectURL(b); scan.img = cv; scan.W = cv.width; scan.H = cv.height; scan.strokes = []; scan.activeStroke = null; scan.zoom = 1; scan.panMode = false; scan.err = ''; scan.phase = 'select'; render() }, 'image/jpeg', 0.9);
    } catch (e) { fail() }
  };
  im.onerror = fail;
  im.src = url;
}

function applyScanZoom() {
  if (!scan) return;
  const sh = $('#sc-shot'), zv = $('#sc-z-val');
  if (sh) sh.style.width = Math.round(scan.zoom * 100) + '%';
  if (zv) zv.textContent = Math.round(scan.zoom * 100) + '%';
}

function bindStage() {
  const ov = $('#ov'), stg = $('#sc-stage'); if (!ov) return;
  const pt = e => { const r = ov.getBoundingClientRect(); return { x: clamp((e.clientX - r.left) / r.width), y: clamp((e.clientY - r.top) / r.height) } };

  let pinchStartDist = 0, pinchStartZoom = 1;
  if (stg) {
    stg.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        scan.activeStroke = null;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDist = Math.hypot(dx, dy);
        pinchStartZoom = scan.zoom;
      }
    }, { passive: true });
    stg.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinchStartDist > 0) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        scan.zoom = Math.max(1, Math.min(3.5, +(pinchStartZoom * (dist / pinchStartDist)).toFixed(2)));
        applyScanZoom();
      }
    }, { passive: true });
    stg.addEventListener('touchend', () => { pinchStartDist = 0; }, { passive: true });
  }

  ov.addEventListener('pointerdown', e => {
    if (scan.panMode) return;
    if (e.pointerType === 'touch' && !e.isPrimary) return;
    e.preventDefault();
    ov.setPointerCapture(e.pointerId);
    const p = pt(e);
    scan.activeStroke = { r: scan.brushR / scan.zoom, pts: [p] };
    drawRects();
  });
  ov.addEventListener('pointermove', e => {
    if (!scan.activeStroke) return;
    const p = pt(e);
    const last = scan.activeStroke.pts[scan.activeStroke.pts.length - 1];
    if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 0.002) {
      scan.activeStroke.pts.push(p);
      drawRects();
    }
  });
  const endSt = () => {
    if (!scan.activeStroke) return;
    scan.strokes.push(scan.activeStroke);
    scan.activeStroke = null;
    drawRects();
  };
  ov.addEventListener('pointerup', endSt);
  ov.addEventListener('pointercancel', endSt);
}

const normRect = d => ({ x: Math.min(d.a.x, d.b.x), y: Math.min(d.a.y, d.b.y), w: Math.abs(d.a.x - d.b.x), h: Math.abs(d.a.y - d.b.y) });

function drawRects() {
  const bcv = $('#sc-bcv');
  const allStrokes = scan.activeStroke ? [...scan.strokes, scan.activeStroke] : scan.strokes;
  const groups = groupStrokesIntoRegions(allStrokes);
  renderBrushOverlay(bcv, scan.strokes, scan.activeStroke, groups);

  const ch = $('#chips');
  if (ch) ch.innerHTML = groups.map((g, i) => '<button class="chip" data-act="sel-del" data-i="' + i + '" aria-label="Usuń zaznaczenie ' + (i + 1) + '">Fiszka #' + (i + 1) + ' ' + ic('x') + '</button>').join('');
  const b = $('#readbtn');
  if (b) {
    b.disabled = !groups.length;
    b.textContent = groups.length ? 'Rozpoznaj tekst (' + groups.length + ' ' + plr(groups.length, 'fiszkę', 'fiszki', 'fiszek') + ')' : 'Rozpoznaj tekst';
  }
}

async function readText() {
  if (!scan) return;
  const groups = groupStrokesIntoRegions(scan.strokes);
  if (!groups.length) return;
  scan.strokes = [];
  scan.activeStroke = null;
  scan.phase = 'reading'; scan.err = ''; render();
  const ctl = new AbortController(); scan.ctl = ctl;
  const dir = scan.hint === 'pl' ? 'pl-de' : 'de-pl';
  const sourceLang = scan.hint === 'pl' ? 'pl' : 'de';

  try {
    const results = [];
    for (let idx = 0; idx < groups.length; idx++) {
      if (ctl.signal.aborted) throw { code: 'cancelled' };
      const progEl = $('#scan-prog');
      if (progEl) progEl.textContent = `Odczytuję zaznaczenie ${idx + 1} z ${groups.length}…`;
      const crop = cropMaskedGroupToCanvas(scan.img, groups[idx]);
      const parsedItems = await recognizeAndParseCanvas(crop, sourceLang, pct => {
        if (progEl) progEl.textContent = `Zaznaczenie ${idx + 1}/${groups.length}: rozpoznawanie ${pct}%…`;
      });
      if (!parsedItems.length) continue;

      for (const item of parsedItems) {
        if (ctl.signal.aborted) throw { code: 'cancelled' };
        if (item.bilingual && item.de && item.pl) {
          if (progEl) progEl.textContent = `Przepisuję ze zdjęcia: „${item.de}” oraz „${item.pl}”…`;
          results.push({
            id: nid('r'),
            on: true,
            de: item.de,
            pl: item.pl,
            note: '',
            from: 'both'
          });
        } else {
          const actualFrom = item.de ? 'de' : (item.pl ? 'pl' : sourceLang);
          results.push({
            id: nid('r'),
            on: true,
            de: item.de || '',
            pl: item.pl || '',
            note: '',
            from: actualFrom
          });
        }
      }
    }
    if (!results.length) {
      scan.err = 'Nie udało się odczytać tekstu z zamalowanego obszaru.';
      scan.phase = 'select';
      render();
      return;
    }
    scan.rows = results;
    scan.phase = 'review';
    render();
  } catch (e) {
    if (e && e.code === 'cancelled') return;
    scan.err = errCopy(e);
    scan.phase = 'select';
    render();
  } finally {
    if (scan) scan.ctl = null;
  }
}

function defaultDest() {
  if (!scan) return;
  const fs = state.folders;
  if (!scan.dest.fid && fs.length) {
    scan.dest.fid = fs[0].id;
  }
  const f = getF(scan.dest.fid);
  if (f && !scan.dest.sid && f.sets.length) {
    scan.dest.sid = f.sets[0].id;
  }
}

function renderDest() {
  const d = $('#dest'); if (!d || !scan) return;
  const fs = state.folders;
  let html = '';
  if (!fs.length) {
    html = `
      <div class="field">
        <label for="dst-nf">Nowy folder</label>
        <input id="dst-nf" type="text" placeholder="np. Język Niemiecki" value="${esc(scan.dest.newFolder || 'Niemiecki')}">
      </div>
      <div class="field">
        <label for="dst-ns">Nowy zestaw</label>
        <input id="dst-ns" type="text" placeholder="np. Lekcja 1" value="${esc(scan.dest.newSet || 'Lekcja 1')}">
      </div>
    `;
  } else {
    const fOpts = fs.map(f => `<option value="${f.id}"${f.id === scan.dest.fid ? ' selected' : ''}>${esc(f.name)}</option>`).join('') + '<option value="__new__">+ Utwórz nowy folder…</option>';
    const f = getF(scan.dest.fid);
    const sOpts = f ? f.sets.map(s => `<option value="${s.id}"${s.id === scan.dest.sid ? ' selected' : ''}>${esc(s.name)}</option>`).join('') + '<option value="__new__">+ Utwórz nowy zestaw…</option>' : '<option value="__new__">+ Utwórz nowy zestaw…</option>';

    html = `
      <div class="field">
        <label for="dst-f">Folder</label>
        <select id="dst-f">${fOpts}</select>
      </div>
      ${scan.dest.fid === '__new__' ? `
        <div class="field">
          <label for="dst-nf">Nazwa nowego folderu</label>
          <input id="dst-nf" type="text" placeholder="np. Język Niemiecki" value="${esc(scan.dest.newFolder)}">
        </div>
      ` : ''}
      <div class="field">
        <label for="dst-s">Zestaw</label>
        <select id="dst-s">${sOpts}</select>
      </div>
      ${(scan.dest.sid === '__new__' || scan.dest.fid === '__new__') ? `
        <div class="field">
          <label for="dst-ns">Nazwa nowego zestawu</label>
          <input id="dst-ns" type="text" placeholder="np. Lekcja 1" value="${esc(scan.dest.newSet)}">
        </div>
      ` : ''}
    `;
  }
  d.innerHTML = html;

  const fSel = $('#dst-f'), sSel = $('#dst-s'), nfInp = $('#dst-nf'), nsInp = $('#dst-ns');
  if (fSel) fSel.onchange = e => { scan.dest.fid = e.target.value; const f = getF(scan.dest.fid); scan.dest.sid = (f && f.sets.length) ? f.sets[0].id : '__new__'; renderDest(); };
  if (sSel) sSel.onchange = e => { scan.dest.sid = e.target.value; renderDest(); };
  if (nfInp) nfInp.oninput = e => { scan.dest.newFolder = e.target.value; };
  if (nsInp) nsInp.oninput = e => { scan.dest.newSet = e.target.value; };
}

function commitScan() {
  if (!scan) return;
  const checkedRows = scan.rows.filter(r => r.on);
  if (!checkedRows.length) { toast('Zaznacz co najmniej jedną fiszkę.'); return; }
  if (checkedRows.some(r => !r.de.trim() || !r.pl.trim())) {
    toast('Uzupełnij ręcznie brakujące tłumaczenia (niemiecki i polski) w zaznaczonych fiszkach.');
    return;
  }
  const activeRows = checkedRows;

  let targetFid = scan.dest.fid;
  let targetSid = scan.dest.sid;

  if (!state.folders.length || targetFid === '__new__') {
    const fName = (scan.dest.newFolder || 'Nowy folder').trim() || 'Nowy folder';
    const nf = addFolder(fName);
    targetFid = nf.id;
  }

  const f = getF(targetFid);
  if (!f.sets.length || targetSid === '__new__') {
    const sName = (scan.dest.newSet || 'Zestaw 1').trim() || 'Zestaw 1';
    const ns = addSet(targetFid, sName);
    targetSid = ns.id;
  }

  const s = getS(targetFid, targetSid);
  activeRows.forEach(r => {
    s.cards.push(newCard(r.de, r.pl, r.note));
  });

  touch();
  toast(`Dodano ${activeRows.length} ${plr(activeRows.length, 'fiszkę', 'fiszki', 'fiszek')}`);
  endScan();
  nav({ n: 'set', f: targetFid, s: targetSid });
}

function startStudy(fid, sid, opts) {
  const f = getF(fid), s = getS(fid, sid);
  if (!f || !s || !s.cards.length) return;

  const mode = (opts && opts.mode) || 'flip';
  const cards = [...s.cards];
  shuffle(cards);

  study = {
    fid, sid, scope: 'set', phase: 'run', i: 0,
    queue: cards.map(c => ({ id: c.id, de: c.de, pl: c.pl, note: c.note, box: c.box || 0 })),
    o: { mode },
    flipped: false,
    typed: '',
    feedback: null,
    stats: { correct: 0, wrong: 0 },
    missed: []
  };
  saveActiveSession();
  nav({ n: 'study' });
}

function startFolderStudy(fid, opts) {
  const f = getF(fid);
  if (!f) return;
  const allCards = [];
  for (const st of f.sets) {
    for (const cd of st.cards) {
      allCards.push({ id: cd.id, de: cd.de, pl: cd.pl, note: cd.note, box: cd.box || 0, setName: st.name });
    }
  }
  if (!allCards.length) return;

  const mode = (opts && opts.mode) || 'flip';
  shuffle(allCards);

  study = {
    fid, sid: null, scope: 'folder', phase: 'run', i: 0,
    queue: allCards,
    o: { mode },
    flipped: false,
    typed: '',
    feedback: null,
    stats: { correct: 0, wrong: 0 },
    missed: []
  };
  saveActiveSession();
  nav({ n: 'study' });
}

function saveActiveSession() {
  if (!study || study.phase !== 'run') {
    state.activeSession = null;
  } else {
    state.activeSession = {
      fid: study.fid,
      sid: study.sid,
      scope: study.scope || (study.sid ? 'set' : 'folder'),
      i: study.i,
      queue: study.queue,
      o: study.o,
      stats: study.stats,
      missed: study.missed || []
    };
  }
  touch();
}

function resumeActiveSession() {
  const ses = state.activeSession;
  if (!ses) return;
  const f = getF(ses.fid);
  const scope = ses.scope || (ses.sid ? 'set' : 'folder');
  const s = scope === 'set' ? getS(ses.fid, ses.sid) : null;
  if (!f || (scope === 'set' && !s)) { state.activeSession = null; touch(); render(); return; }

  study = {
    fid: ses.fid,
    sid: ses.sid || null,
    scope,
    phase: 'run',
    i: ses.i,
    queue: ses.queue,
    o: ses.o || { mode: 'flip' },
    flipped: false,
    typed: '',
    feedback: null,
    stats: ses.stats || { correct: 0, wrong: 0 },
    missed: ses.missed || []
  };
  nav({ n: 'study' });
}

function discardActiveSession() {
  state.activeSession = null;
  touch();
  render();
}

function viewStudy() {
  if (!study) return '<div class="empty"><p>Brak aktywnej sesji nauki.</p></div>';
  const f = getF(study.fid), s = getS(study.fid, study.sid);
  const backBtn = '<button class="btn ghost sm" data-act="study-exit">' + ic('x') + ' Wyjdź</button>';

  if (study.phase === 'summary') {
    const total = study.stats.correct + study.stats.wrong;
    const pct = total ? Math.round((study.stats.correct / total) * 100) : 100;
    const hasMissed = pct < 100 && study.missed && study.missed.length > 0;
    return `
      <div class="top">${backBtn}</div>
      <div style="text-align:center;padding:20px 0">
        <h1 class="h1">Koniec sesji!</h1>
        <div class="score">${pct}%</div>
        <p class="muted" style="margin:0 auto 20px">Poprawne odpowiedzi: <b>${study.stats.correct}</b> z <b>${total}</b></p>
        <div class="actions" style="justify-content:center">
          ${hasMissed ? `<button class="btn primary big" data-act="study-repeat-missed">${ic('play')} Powtórz (${study.missed.length})</button>` : ''}
          <button class="btn ${hasMissed ? '' : 'primary '}big" data-act="study-restart">${ic('play')} Powtórz od nowa</button>
          <button class="btn big" data-act="study-exit">Wróć do zestawu</button>
        </div>
      </div>
    `;
  }

  const curr = study.queue[study.i];
  if (!curr) return '';

  const pct = Math.round((study.i / study.queue.length) * 100);

  const isFolderStudy = (study.scope === 'folder') || !study.sid;
  const studyCrumbs = isFolderStudy
    ? crumbs([['home', null, null, 'Biblioteka'], ['folder', f ? f.id : '', null, f ? (f.name + ' (wszystkie fiszki)') : '']])
    : crumbs([['home', null, null, 'Biblioteka'], ['folder', f ? f.id : '', null, f ? f.name : ''], ['set', f ? f.id : '', s ? s.id : '', s ? s.name : '']]);

  if (study.o.mode === 'flip') {
    return `
      <div class="top">
        ${studyCrumbs}
        ${backBtn}
      </div>
      <div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--fg-2);margin-bottom:6px">
          <span>Karta ${study.i + 1} z ${study.queue.length}</span>
          <span>${pct}%</span>
        </div>
        <div class="meter"><i style="width:${pct}%"></i></div>
      </div>

      <div class="fc-wrap">
        <div class="fc ${study.flipped ? 'flipped' : ''}" id="fc-card" role="button" tabindex="0" aria-label="Fiszka: kliknij aby obrócić; przesuń w lewo jeśli nie umiesz, przesuń w prawo jeśli umiesz">
          <div class="fc-swipe" id="fc-swipe">
            <div class="fc-in">
              <div class="face front">
                <span class="swipe-stamp left" id="stamp-left">← Nie umiem</span>
                <span class="swipe-stamp right" id="stamp-right">Umiem →</span>
                <div class="head"><span class="tag de">Niemiecki</span></div>
                <div class="bd">
                  <span class="term">${esc(curr.de)}</span>
                  ${curr.note ? `<span class="nt2">${esc(curr.note)}</span>` : ''}
                </div>
              </div>
              <div class="face back">
                <span class="swipe-stamp left" id="stamp-left-b">← Nie umiem</span>
                <span class="swipe-stamp right" id="stamp-right-b">Umiem →</span>
                <div class="head"><span class="tag pl">Polski</span></div>
                <div class="bd">
                  <span class="term">${esc(curr.pl)}</span>
                  ${curr.note ? `<span class="nt2">${esc(curr.note)}</span>` : ''}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="swipe-hint-bar" aria-hidden="true">
        <span class="sh-l">← Przesuń w lewo: Nie umiem</span>
        <span class="sh-r">Przesuń w prawo: Umiem →</span>
      </div>
      <p class="small" style="text-align:center;color:var(--fg-2);margin:6px 0 0">Dotknij lub kliknij fiszkę, aby ją obrócić. Przesuń w lewo („nie umiem”) lub w prawo („umiem”).</p>
    `;
  }

  return `
    <div class="top">
      ${studyCrumbs}
      ${backBtn}
    </div>
    <div style="margin-top:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--fg-2);margin-bottom:6px">
        <span>Karta ${study.i + 1} z ${study.queue.length}</span>
        <span>${pct}%</span>
      </div>
      <div class="meter"><i style="width:${pct}%"></i></div>
    </div>

    <div class="fc-wrap">
      <div class="face static">
        <div class="head"><span class="tag pl">Przetłumacz na niemiecki</span></div>
        <div class="bd">
          <span class="term">${esc(curr.pl)}</span>
          ${curr.note ? `<span class="nt2">${esc(curr.note)}</span>` : ''}
        </div>
      </div>
    </div>

    ${study.feedback ? `
      <div class="fb ${study.feedback.ok ? 'ok' : 'no'}">${study.feedback.text}</div>
      <div class="dock">
        <button type="button" class="btn primary big" style="width:100%" data-act="next-write">Kontynuuj</button>
      </div>
    ` : `
      <form id="write-form" style="margin-top:14px">
        <div class="field">
          <label for="w-ans">Twoja odpowiedź po niemiecku</label>
          <input id="w-ans" type="text" lang="de" autocomplete="off" placeholder="Wpisz słowo po niemiecku…" value="${esc(study.typed)}">
        </div>
        <div class="dock">
          <button type="submit" class="btn primary big" style="width:100%">Sprawdź odpowiedź</button>
        </div>
      </form>
    `}
  `;
}

function afterStudy() {
  if (!study || study.phase !== 'run') return;
  const fc = $('#fc-card');
  const swipeEl = $('#fc-swipe');
  if (fc && swipeEl) {
    let startX = 0, startY = 0, dx = 0, isDragging = false, moved = false, activePointerId = null;
    const threshold = 78;

    const setStamps = (val) => {
      const leftOp = val < -18 ? Math.min(1, (-val - 18) / (threshold - 18)) : 0;
      const rightOp = val > 18 ? Math.min(1, (val - 18) / (threshold - 18)) : 0;
      ['#stamp-left', '#stamp-left-b'].forEach(sel => {
        const el = $(sel);
        if (el) el.style.opacity = String(leftOp);
      });
      ['#stamp-right', '#stamp-right-b'].forEach(sel => {
        const el = $(sel);
        if (el) el.style.opacity = String(rightOp);
      });
    };

    const resetCardVisual = () => {
      fc.classList.remove('dragging');
      swipeEl.style.transform = '';
      swipeEl.style.opacity = '';
      setStamps(0);
    };

    const commitGesture = (know) => {
      const dirSign = know ? 1 : -1;
      fc.classList.remove('dragging');
      swipeEl.style.transition = 'transform .22s ease-out, opacity .22s ease-out';
      swipeEl.style.transform = `translateX(${dirSign * 260}px) rotate(${dirSign * 12}deg)`;
      swipeEl.style.opacity = '0';
      setTimeout(() => {
        if (!study || study.phase !== 'run') return;
        answerFlip(know);
      }, 190);
    };

    fc.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      activePointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      dx = 0;
      isDragging = true;
      moved = false;
      fc.classList.add('dragging');
      try { fc.setPointerCapture(e.pointerId); } catch (_) {}
    });

    fc.addEventListener('pointermove', e => {
      if (!isDragging || e.pointerId !== activePointerId) return;
      const curDx = e.clientX - startX;
      const curDy = e.clientY - startY;
      if (!moved && Math.hypot(curDx, curDy) > 8) {
        moved = true;
      }
      if (moved) {
        dx = curDx;
        const rot = Math.max(-14, Math.min(14, dx * 0.045));
        swipeEl.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
        setStamps(dx);
      }
    });

    const finishPointer = e => {
      if (!isDragging || (e && e.pointerId !== undefined && e.pointerId !== activePointerId)) return;
      isDragging = false;
      activePointerId = null;
      if (moved) {
        if (dx >= threshold) {
          commitGesture(true);
        } else if (dx <= -threshold) {
          commitGesture(false);
        } else {
          resetCardVisual();
        }
      } else {
        resetCardVisual();
        study.flipped = !study.flipped;
        render();
      }
    };

    fc.addEventListener('pointerup', finishPointer);
    fc.addEventListener('pointercancel', finishPointer);
    fc.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        study.flipped = !study.flipped;
        render();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        commitGesture(true);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        commitGesture(false);
      }
    });
  }
  const wf = $('#write-form');
  if (wf) {
    wf.onsubmit = e => {
      e.preventDefault();
      const inp = $('#w-ans');
      const typed = inp ? inp.value.trim() : '';
      checkWriteAnswer(typed);
    };
    const inp = $('#w-ans');
    if (inp) inp.focus();
  }
}

function checkWriteAnswer(typed) {
  if (!study || study.phase !== 'run') return;
  const curr = study.queue[study.i];
  const cleanAns = typed.toLowerCase().replace(/^(der|die|das)\s+/, '').trim();
  const cleanTarget = curr.de.toLowerCase().replace(/^(der|die|das)\s+/, '').trim();

  const isExact = typed.trim().toLowerCase() === curr.de.trim().toLowerCase();
  const isClose = cleanAns === cleanTarget;

  if (isExact || isClose) {
    study.feedback = { ok: true, text: `Świetnie! Poprawna odpowiedź: ${curr.de}` };
    study.stats.correct++;
    updateCardBox(curr.id, true);
  } else {
    study.feedback = { ok: false, text: `Niestety. Prawidłowa odpowiedź: ${curr.de}` };
    study.stats.wrong++;
    if (!study.missed.some(x => x.id === curr.id)) study.missed.push({ ...curr });
    updateCardBox(curr.id, false);
  }
  render();
}

function answerFlip(know) {
  if (!study || study.phase !== 'run') return;
  const curr = study.queue[study.i];
  if (know) {
    study.stats.correct++;
    updateCardBox(curr.id, true);
  } else {
    study.stats.wrong++;
    if (!study.missed.some(x => x.id === curr.id)) study.missed.push({ ...curr });
    updateCardBox(curr.id, false);
  }
  advanceStudy();
}

function updateCardBox(cardId, correct) {
  for (const f of state.folders) {
    for (const s of f.sets) {
      const c = s.cards.find(x => x.id === cardId);
      if (c) {
        if (correct) {
          c.box = Math.min(3, (c.box || 0) + 1);
        } else {
          c.box = Math.max(0, (c.box || 0) - 1);
        }
        touch();
        return;
      }
    }
  }
}

function advanceStudy() {
  study.i++;
  study.flipped = false;
  study.typed = '';
  study.feedback = null;
  if (study.i >= study.queue.length) {
    study.phase = 'summary';
    state.activeSession = null;
    touch();
  } else {
    saveActiveSession();
  }
  render();
}

function promptStudyOptions(fid, sid) {
  openSheet(`
    <h2>Rozpocznij naukę</h2>
    <p class="muted">Wybierz tryb nauki dla tego zestawu:</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin:16px 0">
      <button class="btn big primary" id="st-flip" style="justify-content:flex-start">${ic('play')} <div><b>Fiszki (odwracanie)</b><br><span style="font-weight:400;font-size:13px">Zobacz pojęcie, pomyśl i sprawdź odpowiedź</span></div></button>
      <button class="btn big" id="st-write" style="justify-content:flex-start">${ic('edit')} <div><b>Pisanie</b><br><span style="font-weight:400;font-size:13px">Wpisuj odpowiedzi z klawiatury po niemiecku</span></div></button>
    </div>
    <div class="sheet-actions">
      <button class="btn" data-act="sheet-x">Anuluj</button>
    </div>
  `, sh => {
    sh.querySelector('#st-flip').onclick = () => { closeSheet(); startStudy(fid, sid, { mode: 'flip' }); };
    sh.querySelector('#st-write').onclick = () => { closeSheet(); startStudy(fid, sid, { mode: 'write' }); };
  });
}

function promptFolderStudyOptions(fid) {
  const f = getF(fid);
  const total = f ? f.sets.reduce((sum, item) => sum + item.cards.length, 0) : 0;
  openSheet(`
    <h2>Powtórka całego folderu</h2>
    <p class="muted">Powtórzysz wszystkie fiszki (${total}) ze wszystkich zestawów w folderze <b>${esc(f ? f.name : '')}</b>:</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin:16px 0">
      <button class="btn big primary" id="stf-flip" style="justify-content:flex-start">${ic('play')} <div><b>Fiszki (odwracanie)</b><br><span style="font-weight:400;font-size:13px">Przeglądaj wszystkie fiszki z folderu z gestami</span></div></button>
      <button class="btn big" id="stf-write" style="justify-content:flex-start">${ic('edit')} <div><b>Pisanie</b><br><span style="font-weight:400;font-size:13px">Sprawdź pisownię wszystkich słów z folderu</span></div></button>
    </div>
    <div class="sheet-actions">
      <button class="btn" data-act="sheet-x">Anuluj</button>
    </div>
  `, sh => {
    sh.querySelector('#stf-flip').onclick = () => { closeSheet(); startFolderStudy(fid, { mode: 'flip' }); };
    sh.querySelector('#stf-write').onclick = () => { closeSheet(); startFolderStudy(fid, { mode: 'write' }); };
  });
}

document.addEventListener('input', e => {
  const t = e.target;
  if (!scan || scan.phase !== 'review') return;
  const rowEl = t.closest('[data-r]');
  if (!rowEl) return;
  const rId = rowEl.dataset.r;
  const row = scan.rows.find(x => x.id === rId);
  if (!row) return;

  const field = t.dataset.in;
  if (field === 'de') row.de = t.value;
  if (field === 'pl') row.pl = t.value;
  if (field === 'note') row.note = t.value;
});

document.addEventListener('change', e => {
  const t = e.target;
  if (!scan || scan.phase !== 'review') return;
  const rowEl = t.closest('[data-r]');
  if (!rowEl) return;
  const rId = rowEl.dataset.r;
  const row = scan.rows.find(x => x.id === rId);
  if (!row) return;

  if (t.dataset.in === 'on') {
    row.on = t.checked;
    rowEl.classList.toggle('off', !row.on);
    const n = scan.rows.filter(x => x.on).length;
    const addBtn = $('#addbtn');
    if (addBtn) addBtn.textContent = `Dodaj ${n} ${plr(n, 'fiszkę', 'fiszki', 'fiszek')}`;
  }
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;

  if (act === 'home') nav({ n: 'home' });
  else if (act === 'open-login') openLoginSheet();
  else if (act === 'open-register') openRegisterSheet();
  else if (act === 'open-profile') openProfileSheet();
  else if (act === 'toggle-theme') toggleTheme();
  else if (act === 'retry') { if (cloud.user && cloud.isCloud) pushCloud(); }
  else if (act === 'nav') nav({ n: b.dataset.n, f: b.dataset.f, s: b.dataset.s });
  else if (act === 'del-folder') promptDeleteFolder(b.dataset.f || view.f);
  else if (act === 'new-folder') folderSheet();
  else if (act === 'edit-folder') folderSheet(getF(view.f));
  else if (act === 'new-set') setSheet(view.f);
  else if (act === 'edit-set') setSheet(view.f, getS(view.f, view.s));
  else if (act === 'new-card') cardSheet(view.f, view.s);
  else if (act === 'edit-card') cardSheet(view.f, view.s, getS(view.f, view.s)?.cards.find(x => x.id === b.dataset.c));
  else if (act === 'study') promptStudyOptions(view.f, view.s);
  else if (act === 'study-set') promptStudyOptions(b.dataset.f, b.dataset.s);
  else if (act === 'study-folder') promptFolderStudyOptions(b.dataset.f || view.f);
  else if (act === 'scan-start') startScan();
  else if (act === 'scan-exit') endScan();
  else if (act === 'pick-cam') { const f = $('#fcam'); if (f) f.click(); }
  else if (act === 'pick-gal') { const f = $('#fgal'); if (f) f.click(); }
  else if (act === 'sc-z-in') { scan.zoom = Math.min(3.5, +(scan.zoom + 0.35).toFixed(2)); applyScanZoom(); }
  else if (act === 'sc-z-out') { scan.zoom = Math.max(1, +(scan.zoom - 0.35).toFixed(2)); applyScanZoom(); }
  else if (act === 'sc-z-rst') { scan.zoom = 1; applyScanZoom(); }
  else if (act === 'sc-mode-draw') { scan.panMode = false; render(); }
  else if (act === 'sc-mode-pan') { scan.panMode = true; render(); }
  else if (act === 'sc-br') { scan.brushR = parseFloat(b.dataset.br); render(); }
  else if (act === 'sel-all') { scan.strokes = [{ fullImage: true, pts: [] }]; drawRects(); }
  else if (act === 'sel-undo') { scan.strokes.pop(); drawRects(); }
  else if (act === 'sel-clear') { scan.strokes = []; scan.activeStroke = null; drawRects(); }
  else if (act === 'sel-del') {
    const groups = groupStrokesIntoRegions(scan.strokes);
    const targetG = groups[+b.dataset.i];
    if (targetG) {
      scan.strokes = scan.strokes.filter(st => !targetG.strokes.includes(st));
      drawRects();
    }
  }
  else if (act === 'rescan') { scan.phase = 'pick'; render(); }
  else if (act === 'hint') { scan.hint = b.dataset.v; render(); }
  else if (act === 'read') readText();
  else if (act === 'stop') { if (scan && scan.ctl) scan.ctl.abort(); scan.phase = 'select'; render(); }
  else if (act === 'all-on') { scan.rows.forEach(r => r.on = true); render(); }
  else if (act === 'all-off') { scan.rows.forEach(r => r.on = false); render(); }
  else if (act === 'add-row') { scan.rows.push({ id: nid('r'), on: true, de: '', pl: '', note: '', from: 'de' }); render(); }
  else if (act === 'back-select') { scan.phase = 'select'; render(); }
  else if (act === 'commit') commitScan();
  else if (act === 'sheet-x') closeSheet();
  else if (act === 'resume-session') resumeActiveSession();
  else if (act === 'discard-session') discardActiveSession();
  else if (act === 'study-exit') {
    const sid = study?.sid, fid = study?.fid, isFolderScope = (study?.scope === 'folder') || !sid;
    study = null;
    if (isFolderScope) {
      nav(getF(fid) ? { n: 'folder', f: fid } : { n: 'home' });
    } else {
      nav(getS(fid, sid) ? { n: 'set', f: fid, s: sid } : { n: 'home' });
    }
  }
  else if (act === 'study-repeat-missed') {
    if (study && study.missed && study.missed.length) {
      const missedCards = [...study.missed];
      shuffle(missedCards);
      study = {
        fid: study.fid,
        sid: study.sid,
        phase: 'run',
        i: 0,
        queue: missedCards.map(c => ({ id: c.id, de: c.de, pl: c.pl, note: c.note, box: c.box || 0 })),
        o: study.o,
        flipped: false,
        typed: '',
        feedback: null,
        stats: { correct: 0, wrong: 0 },
        missed: []
      };
      saveActiveSession();
      render();
    }
  }
  else if (act === 'study-restart') { if ((study.scope === 'folder') || !study.sid) startFolderStudy(study.fid, study.o); else startStudy(study.fid, study.sid, study.o); }
  else if (act === 'flip-card') { if (study) { study.flipped = true; render(); } }
  else if (act === 'answer-again') answerFlip(false);
  else if (act === 'answer-know') answerFlip(true);
  else if (act === 'next-write') advanceStudy();
});

const LS_THEME = 'fiszkownik.theme';
const SUN_ICON = '<svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
const MOON_ICON = '<svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

function getEffectiveTheme() {
  const explicit = document.documentElement.getAttribute('data-theme');
  if (explicit === 'dark' || explicit === 'light') return explicit;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}

function updateThemeButton() {
  const btn = $('#btn-theme');
  if (!btn) return;
  const isDark = getEffectiveTheme() === 'dark';
  btn.innerHTML = isDark ? SUN_ICON : MOON_ICON;
  const label = isDark ? 'Przełącz na motyw jasny' : 'Przełącz na motyw ciemny';
  btn.title = label;
  btn.setAttribute('aria-label', label);
}

function toggleTheme() {
  const next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(LS_THEME, next); } catch (e) {}
  updateThemeButton();
}

window.onload = function () {
  const currentUserRaw = localStorage.getItem(LS_CURRENT_USER);
  let currentUser = null;
  try { if (currentUserRaw) currentUser = JSON.parse(currentUserRaw); } catch(e){}

  if (currentUser) {
    cloud.user = currentUser;
    cloud.isCloud = !currentUser.uid.startsWith('local_');
  }

  const localData = loadLocal();
  if (localData) {
    state.folders = localData.folders || [];
    state.activeSession = localData.activeSession || null;
  } else if (!currentUser) {
    const defaultFolder = addFolder('Język Niemiecki', 0);
    const defaultSet = addSet(defaultFolder.id, 'Podstawowe zwroty');
    defaultSet.cards.push(
      newCard('Guten Tag', 'Dzień dobry', 'Powitanie'),
      newCard('Danke schön', 'Dziękuję bardzo', 'Zwrot grzecznościowy'),
      newCard('Auf Wiedersehen', 'Do widzenia', 'Pożegnanie'),
      newCard('Ich heiße...', 'Nazywam się...', 'Przedstawianie się')
    );
    saveLocal();
  }

  updateThemeButton();
  updateHeaderAuthUI();
  setStatus(cloud.user ? (cloud.isCloud ? 'synced' : 'local_account') : 'local');

  probeSample();
  render();
};
</script>
